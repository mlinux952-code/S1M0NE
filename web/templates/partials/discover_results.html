{% if not results %}
<p class="muted">Aucun résultat{% if query %} pour « {{ query }} »{% endif %}.</p>
{% else %}
<table>
    <tr><th>Nom</th><th>Site</th><th>Catégorie</th><th>Description</th><th>Lien</th></tr>
    {% for e in results %}
    <tr>
        <td>{{ e.name }}</td>
        <td><span class="badge">{{ e.site }}</span></td>
        <td>{{ e.category }}</td>
        <td>{{ e.description }}</td>
        <td><a href="{{ e.url }}" target="_blank" rel="noopener noreferrer">ouvrir ↗</a></td>
    </tr>
    {% endfor %}
</table>
<p class="muted">{{ results|length }} résultat(s).</p>
{% endif %}
