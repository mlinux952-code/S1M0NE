{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<h1>Connexion</h1>
<p class="hint">Le terminal web de S1M0NE est protégé par mot de passe (config <code>.env</code>
   <code>S1MONE_WEB_PASSWORD</code> — voir <code>NEXT_STEPS.md</code> §A.1).</p>

{% if error %}
<p class="hint" style="color:#e05a5a;">Mot de passe incorrect.</p>
{% endif %}

<form method="post" action="/login" class="card" style="max-width:320px;">
    <label for="password" style="display:block;margin-bottom:0.5rem;color:#9aa0aa;">Mot de passe</label>
    <input
        type="password"
        id="password"
        name="password"
        autofocus
        style="width:100%;padding:0.5rem;background:#171a21;color:#e6e6e6;border:1px solid #2a2e37;border-radius:6px;margin-bottom:1rem;"
    >
    <button type="submit" style="width:100%;">Se connecter</button>
</form>
{% endblock %}
