[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s1mone"
version = "0.1.0"
description = "S1M0NE — plateforme personnelle intelligente (maison numérique), optimisée low-resource."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "psutil>=5.9",
]

[project.scripts]
s1mone = "cli.main:main"

[tool.setuptools]
packages = ["core", "system", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
