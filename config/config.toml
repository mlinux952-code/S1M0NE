# S1M0NE — configuration centrale
# Ce fichier contient des réglages NON sensibles.
# Les secrets (clés API, tokens) vont exclusivement dans .env (jamais ici, jamais dans Git).

[server]
host = "0.0.0.0"
port = 8420

[database]
# Chemin relatif à DATA_DIR
filename = "s1mone.db"

[storage]
# DATA_DIR peut être surchargé par la variable d'environnement S1MONE_DATA_DIR
data_dir = "data"
logs_dir = "logs"
cache_dir = "data/cache"

[resource_limits]
# Seuils utilisés par le Resource Manager
ram_warning_percent = 80
ram_critical_percent = 92
swap_warning_percent = 50
cpu_warning_percent = 90

# Parallélisme du Task Manager selon le niveau de ressources détecté (mega-prompt §18)
max_parallel_tasks_normal = 2
max_parallel_tasks_warning = 1
max_parallel_tasks_critical = 0

[logging]
level = "INFO"
max_bytes = 1048576
backup_count = 3

[search]
enabled_connectors = []

[cache]
# Durée de vie par défaut (secondes) d'une entrée de cache créée sans TTL explicite.
default_ttl_seconds = 300

[ai]
# Fournisseur utilisé par défaut par "s1mone chat" et /api/chat si --provider n'est pas précisé.
# Choix possibles : "groq" (recommandé, gratuit, rapide), "openrouter" (gratuit, catalogue
# variable), "ollama" (local, privé, mais lent sur cette machine). Voir README.md.
default_provider = "groq"

# Surcharge de modèle par fournisseur (facultatif — sinon chaque fournisseur a un modèle par
# défaut raisonnable codé en dur dans ai/providers/*.py).
# [ai.groq]
# model = "openai/gpt-oss-120b"
# [ai.openrouter]
# model = "meta-llama/llama-3.3-70b-instruct:free"
# [ai.ollama]
# model = "qwen2.5:0.5b"

[plugins]
# Dossier surveillé pour les plugins locaux (Phase 8) : tout fichier .py posé ici est chargé au
# démarrage (préfixer par '_' pour désactiver sans supprimer). Voir plugins_local/README.md.
dir = "plugins_local"

[security]
require_confirmation_for_dangerous_commands = true

# Phase 9 — permissions pour les commandes système réelles (s1mone exec / terminal web).
# Niveaux possibles (croissants) : READ, WRITE, EXECUTE, ADMIN. Voir core/permissions.py pour
# le détail du catalogue de commandes et le niveau requis par chacune.
#
# Terminal local (CLI) : ADMIN par défaut. C'est toi qui lances "s1mone" sur ta propre session,
# la confiance est la même qu'un terminal shell classique.
cli_permission_level = "ADMIN"
#
# Terminal web : READ par défaut, volontairement plus prudent. L'interface web écoute sur
# 0.0.0.0 sans authentification (mega-prompt : low-resource first, pas de système de comptes) —
# n'importe quel appareil de ton réseau local peut l'atteindre. Élève ce niveau seulement si tu
# fais confiance à ton réseau (ex. "WRITE" pour autoriser mkdir/touch/cp depuis le navigateur).
web_permission_level = "READ"
#
# Toutes les commandes qui manipulent des chemins (ls, cat, mkdir, touch, cp, mv, rm) restent
# bornées à ce dossier, même au niveau ADMIN — jamais le disque entier. Par défaut : DATA_DIR.
# fs_root = "data"
